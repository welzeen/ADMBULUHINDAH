<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laporan Gudang Buluh Indah</title><meta name="theme-color" content="#2a2670"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gudang BI"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232a2670%27/%3E%3Cpath d=%27M7 11l9-4 9 4v10l-9 4-9-4z M7 11l9 4 9-4 M16 15v10%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"><style>:root{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Gudang Buluh Indah: abu beton + merah Gramedia, huruf kondensed ala label pengiriman.
   Desktop: rel samping penuh. Ponsel: menu bawah, tabel jadi kartu, tombol tambah mengambang, formulir naik dari bawah. */
:root{
  --bg:#f1eefb; --surface:#ffffff; --fg:#1f1b3d; --muted:#5f5a80; --line:#e2dcf3; --line2:#eee9f9;
  --red:#5b45d6; --btn:#5b45d6; --btn-fg:#ffffff; --red-soft:#ebe7ff; --side:#2a2670; --side-fg:#ffffff;
  --ok:#17653a; --ok-bg:#dff1e6; --ok-fill:#2a9a5b;
  --warn:#7a4f00; --warn-bg:#fbeabd; --warn-fill:#d9961a;
  --bad:#a3221b; --bad-bg:#fbe2e0; --bad-fill:#d4443c;
  --in:#8b86b0; --track:#e6e1f5; --head:#f7f4fe; --sh:none;
  --sky:linear-gradient(180deg,#1c2260 0%,#4a3f96 40%,#b9599a 72%,#ff9f6e 100%);
  --far:#4b3b88; --bld:#2b2563; --bld2:#3a3280; --roof:#3d3585; --door:#4a4196; --ground:#211c52; --dash:#6a5fb8;
  --lamp:#ffd27a; --win:#ffd98a; --cloud:#ffc2b8; --cloud2:#e07fa6; --sun1:#fff1b8; --sun2:#ffb46b; --halo:#ffb27a;
  --belt:#4a4196; --box:#e3b27a; --box2:#b98450; --tape:#f6dcae; --sign:#ff7a45; --fk:#ffb347;
  --hair:#2b2670; --skin:#ffe2d0; --iris:#52bfd3; --hat:#ffd23f; --hat2:#ffb800; --vest:#ff8a3d; --shirt:#4ad0c4; --pants:#3b3680;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Zen Maru Gothic','Nunito',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0c24; --surface:#17163a; --fg:#eeecff; --muted:#a09bc8; --line:#2c2a5a; --line2:#232150;
    --red:#b3a8ff; --btn:#6c57f0; --btn-fg:#ffffff; --red-soft:#2a2660; --side:#1a1750; --side-fg:#ffffff;
    --ok:#6fd69b; --ok-bg:#12301f; --ok-fill:#36a766;
    --warn:#f0c04c; --warn-bg:#34290a; --warn-fill:#c9971f;
    --bad:#ff918a; --bad-bg:#3a1a18; --bad-fill:#de5f58;
    --in:#8480b4; --track:#2c2a5a; --head:#1d1b46; color-scheme:dark;
    --sky:linear-gradient(180deg,#080a22 0%,#15173f 45%,#2b2461 80%,#4a3a86 100%);
  --far:#1e1a52; --bld:#141238; --bld2:#1b1948; --roof:#1f1c52; --door:#2a2766; --ground:#0f0e2c; --dash:#4a4590;
  --cloud:#6a60b4; --cloud2:#3b3480; --sun1:#fffbe6; --sun2:#e9e4ff; --halo:#a79cff; --belt:#2a2766; --sign:#e8663a;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0c24; --surface:#17163a; --fg:#eeecff; --muted:#a09bc8; --line:#2c2a5a; --line2:#232150;
    --red:#b3a8ff; --btn:#6c57f0; --btn-fg:#ffffff; --red-soft:#2a2660; --side:#1a1750; --side-fg:#ffffff;
    --ok:#6fd69b; --ok-bg:#12301f; --ok-fill:#36a766;
    --warn:#f0c04c; --warn-bg:#34290a; --warn-fill:#c9971f;
    --bad:#ff918a; --bad-bg:#3a1a18; --bad-fill:#de5f58;
    --in:#8480b4; --track:#2c2a5a; --head:#1d1b46; color-scheme:dark;
    --sky:linear-gradient(180deg,#080a22 0%,#15173f 45%,#2b2461 80%,#4a3a86 100%);
  --far:#1e1a52; --bld:#141238; --bld2:#1b1948; --roof:#1f1c52; --door:#2a2766; --ground:#0f0e2c; --dash:#4a4590;
  --cloud:#6a60b4; --cloud2:#3b3480; --sun1:#fffbe6; --sun2:#e9e4ff; --halo:#a79cff; --belt:#2a2766; --sign:#e8663a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ic{width:20px;height:20px;flex:0 0 auto;display:block}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* rel samping */
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;gap:18px;padding:22px 14px 18px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.2)}
.brand b{font-family:var(--font-head);font-size:22px;font-weight:700;line-height:1.05;display:block}
.brand span.k{font-size:12px;opacity:.8}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:#2a2670;display:grid;place-items:center;flex:0 0 auto}
.logo .ic{width:22px;height:22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:inherit;text-decoration:none;padding:11px 12px;border-radius:8px;font-weight:500;font-size:15px;display:flex;align-items:center;gap:12px;opacity:.92}
.nav a:hover{background:rgba(255,255,255,.14);opacity:1}
.nav a[aria-current="page"]{background:#fff;color:#2a2670;opacity:1;font-weight:700}
.nav .sl{display:none}

/* kepala halaman */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.app>.main{padding:30px 32px 56px;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.th{min-width:0}
.top h1{font-size:38px;font-weight:700;line-height:1.05}
.top p{margin:4px 0 0;color:var(--muted)}
.tr{display:flex;flex-wrap:wrap;gap:8px}
.mbrand{display:none;align-items:center;gap:10px;width:100%}
.mbrand .logo{width:34px;height:34px;background:var(--btn);color:#fff}
.mbrand b{font-family:var(--font-head);font-size:21px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:5px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok::before,.chip.wn::before,.chip.bd::before{content:"";width:8px;height:8px;border-radius:50%}
.chip.ok::before{background:var(--ok-fill)}
.chip.wn::before{background:var(--warn-fill)}
.chip.bd::before{background:var(--bad-fill)}

/* ringkasan */
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{font-size:19px;font-weight:600;display:flex;align-items:center;gap:14px}
.sec>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:26px;background:var(--btn);color:#fff;border-radius:14px;padding:26px 30px 32px}
.banner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 9px,transparent 9px 18px)}
.ring{width:112px;height:112px;flex:0 0 auto;display:block}
.rg-t{fill:none;stroke:rgba(255,255,255,.25);stroke-width:9}
.rg-f{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round}
.rg-n{fill:#fff;font-family:var(--font-head);font-size:23px;font-weight:700}
.bn-txt{min-width:0}
.bn-l{font-size:14px;font-weight:500;opacity:.9}
.bn-v{font-family:var(--font-head);font-size:56px;font-weight:700;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.bn-v small{font-family:var(--font-body);font-size:15px;font-weight:500;opacity:.92;margin-left:10px}
.bn-s{font-size:14px;opacity:.92;margin-top:8px}

/* strip angka: satu blok bersekat, bukan kartu terpisah */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{background:var(--surface);padding:16px 18px 15px;min-width:0;position:relative;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.card .l{font-size:13px;color:var(--muted);font-weight:500;padding-right:36px}
.card .v{font-family:var(--font-head);font-size:40px;font-weight:700;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
.card .v small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.card .s{font-size:13px;color:var(--muted);margin-top:3px}
.card.mini .v{font-size:34px}
.ico{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
.ico .ic{width:17px;height:17px}
.t-r{background:var(--red-soft);color:var(--red)}
.t-g{background:var(--ok-bg);color:var(--ok)}
.t-a{background:var(--warn-bg);color:var(--warn)}
.t-n{background:var(--head);color:var(--fg);border:1px solid var(--line)}
.t-b{background:var(--track);color:var(--muted)}

/* bar dan panel */
.bar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok-fill);border-radius:99px}
i.f-selesai{background:var(--ok-fill)}
i.f-proses{background:var(--warn-fill)}
i.f-belum{background:var(--bad-fill)}
i.f-in{background:var(--in)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:21px;margin-bottom:12px;font-weight:600}
.panel .sub{color:var(--muted);font-size:14px;margin:-6px 0 14px}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0}
.prow .d{font-variant-numeric:tabular-nums;font-weight:600}
.prow .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow{display:grid;grid-template-columns:140px minmax(0,1fr) 96px;gap:12px;align-items:center;padding:7px 0}
.lrow .n{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
.arow:first-of-type{border-top:0;padding-top:2px}
.arow b{font-variant-numeric:tabular-nums}
.arow .m,.m{color:var(--muted);font-size:13px}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;background:var(--track)}
.stack i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;font-size:14px}
.keys span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;background:var(--k)}
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartwrap svg{display:block;width:100%;min-width:560px;height:auto}
.chartwrap .ax{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chartwrap .axb{fill:var(--fg);font-size:10px;font-weight:700;font-family:var(--font-body)}
.chartwrap .gl{stroke:var(--line);stroke-width:1}
.chartwrap .c-in{fill:var(--in)}
.chartwrap .c-out{fill:var(--ok-fill)}

/* toolbar dan tombol */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.exp{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;font-weight:500}
.fld input,.fld select,.fld textarea,.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font-size:15px;min-width:0;width:100%}
.fld input:focus,.form input:focus,.form select:focus,.form textarea:focus,.fld select:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-soft)}
.fld.grow{flex:1 1 220px}
.fld.sm{flex:0 1 160px}
.sp{flex:1 1 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 15px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--head);border-color:var(--in)}
.btn[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[data-act="add"]::before,.btn.primary[data-act="padd"]::before{content:"+";font-weight:700;font-size:18px;line-height:1;margin-right:7px}
.btn[data-exp]::before{content:"↓";margin-right:6px;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px;min-height:34px}

/* tabel */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--head);font-size:13px;line-height:1.25;color:var(--muted);font-weight:600;vertical-align:bottom;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--red)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.lf{color:var(--bad);font-weight:600}
tbody tr:hover{background:var(--head)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--head);border-top:1px solid var(--line);border-bottom:0}
td .note{display:block;font-size:13px;color:var(--muted);max-width:230px}
.mp{margin-top:6px;height:5px;width:84px;border-radius:99px;background:var(--track);overflow:hidden}
.mp i{display:block;height:100%;border-radius:99px}
.tag{font-size:12px;background:var(--red-soft);color:var(--red);padding:1px 8px;border-radius:99px;margin-left:8px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-selesai{background:var(--ok-bg);color:var(--ok)}
.st-proses{background:var(--warn-bg);color:var(--warn)}
.st-belum{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap;align-items:center}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px}
.set{display:flex;flex-direction:column;gap:16px}
.setrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--line2)}
.setrow:first-of-type{border-top:0;padding-top:0}
.setrow p{margin:0;max-width:56ch}
.setrow b{display:block;font-size:16px}

/* formulir */
.overlay{position:fixed;inset:0;background:rgba(10,12,14,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:30}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:560px;margin:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet h2{font-size:28px;font-weight:700}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0;font-weight:500}
.g2,.g3{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px 12px;margin:0}
.info{background:var(--head);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;font-size:14px;color:var(--fg)}
.actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:40;max-width:90vw;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.28)}

/* ---- tablet dan ponsel ---- */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app>.main{padding:16px max(14px,env(safe-area-inset-right,0px)) calc(96px + var(--safe-b)) max(14px,env(safe-area-inset-left,0px));gap:14px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;align-self:auto;padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + var(--safe-b)) max(4px,env(safe-area-inset-left,0px));background:var(--surface);color:var(--muted);border-top:1px solid var(--line);gap:0;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  .brand{display:none}
  .nav{flex-direction:row;width:100%;gap:2px}
  .nav a{flex:1 1 0;min-width:0;position:relative;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 7px;font-size:11px;text-align:center;opacity:1;color:var(--muted);border-radius:8px;font-weight:500}
  .nav a:hover{background:var(--head)}
  .nav a[aria-current="page"]{background:transparent;color:var(--red);font-weight:600}
  .nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
  .nav .lb{display:none}
  .nav .sl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mbrand{display:flex}
  .top{align-items:flex-start;gap:8px}
  .top h1{font-size:32px}
  .top p{font-size:14px}
  .toast{bottom:calc(88px + var(--safe-b))}
  /* tombol tambah mengambang */
  .btn.primary[data-act="add"],.btn.primary[data-act="padd"]{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + var(--safe-b));z-index:25;border-radius:99px;padding:0 22px;min-height:52px;font-size:16px;box-shadow:0 8px 22px rgba(196,22,31,.45)}
}
@media (max-width:700px){
  body{font-size:16px}
  .tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;padding:12px}
  .tools .fld{font-size:12px;gap:3px}
  #dnow{display:none}
  .tools .fld.grow,.tools .chips,.tools .exp,.tools .fld[for="st"]{grid-column:1/-1}
  .tools .fld.sm{flex:none}
  .tools .sp{display:none}
  .chips .btn{flex:1 1 auto}
  .exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .exp .btn{padding:10px 6px;text-align:center}

<div class="overlay" id="modal" hidden>
  <form class="sheet form" id="f" novalidate>
    <h2 id="ftitle">Tambah Data</h2>
    <div class="g2">
      <label for="f-tanggal">Tanggal barang masuk<input id="f-tanggal" type="date"></label>
      <label for="f-kategori">Kategori laporan
        <select id="f-kategori">
          <option value="masuk">Duta TO Buluh Indah</option>
          <option value="luar">Penerimaan STO &amp; Cetul</option>
        </select>
      </label>
    </div>
    <label for="f-asal" id="f-asal-w">Asal barang (toko atau sumber pengiriman)<input id="f-asal" type="text" placeholder="Contoh: Toko A" autocomplete="off"></label>
    <div class="g3">
      <label for="f-book">Book (koli)<input id="f-book" type="number" min="0" step="1" inputmode="numeric" value="0"></label>
      <label for="f-non">Nonbook (koli)<input id="f-non" type="number" min="0" step="1" inputmode="numeric" value="0"></label>
      <label for="f-done">Sudah diproses saat input (koli)<input id="f-done" type="number" min="0" step="1" inputmode="numeric" value="0"></label>
    </div>
    <p class="info" id="f-logged" hidden></p>
    <div class="g2">
      <label for="f-total">Total koli (otomatis)<input id="f-total" readonly tabindex="-1"></label>
      <label for="f-belum">Belum diproses (otomatis)<input id="f-belum" readonly tabindex="-1"></label>
    </div>
    <label for="f-ket">Keterangan tambahan (opsional)<textarea id="f-ket" rows="2"></textarea></label>
    <p class="err" id="ferr" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="f-cancel">Batal</button>
      <button type="submit" class="btn primary">Simpan</button>
    </div>
  </form>
</div>

<div class="overlay" id="pm" hidden>
  <form class="sheet form" id="pf" novalidate>
    <h2>Catat Proses Harian</h2>
    <p class="hint">Catat koli yang selesai diproses pada hari tertentu. Tidak perlu ada barang masuk di hari itu.</p>
    <div class="g2">
      <label for="p-tanggal">Tanggal proses<input id="p-tanggal" type="date"></label>
      <label for="p-koli">Jumlah koli diproses<input id="p-koli" type="number" min="1" step="1" inputmode="numeric" placeholder="0"></label>
    </div>
    <label for="p-mode">Dibagi ke
      <select id="p-mode">
        <option value="auto">Otomatis, barang terlama dulu</option>
        <option value="manual">Pilih laporan tertentu</option>
      </select>
    </label>
    <label for="p-target" id="p-target-w">Laporan yang diproses<select id="p-target"></select></label>
    <p class="info" id="p-info"></p>
    <label for="p-ket">Keterangan (opsional)<textarea id="p-ket" rows="2"></textarea></label>
    <p class="err" id="perr" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="p-cancel">Batal</button>
      <button type="submit" class="btn primary">Simpan Proses</button>
    </div>
  </form>
</div>
<div class="overlay" id="lm" hidden>
  <form class="sheet form" id="lf" novalidate>
    <h2>Masuk admin</h2>
    <p class="hint">Hanya admin yang bisa menambah, mengubah, dan menghapus data. Pengunjung tidak perlu masuk.</p>
    <label for="l-email">Email<input id="l-email" type="email" autocomplete="username" inputmode="email" autocapitalize="none"></label>
    <label for="l-pass">Kata sandi<input id="l-pass" type="password" autocomplete="current-password"></label>
    <p class="err" id="lerr" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="l-cancel">Batal</button>
      <button type="submit" class="btn primary" id="l-ok">Masuk</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden role="status"></div>

(function(){

/* ---------- tanggal ---------- */
function parse(iso){var a=iso.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])}
function addDays(iso,n){var d=new Date(parse(iso)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayName(iso){return DAYN[new Date(parse(iso)).getUTCDay()]}

/* ---------- state ---------- */
var rows=[],proses=[],pmap={},validP=[],loaded=false,mode='init',loadSlow=false;
var route='dashboard',pendingDel=null,pendingDelP=null,editing=null,confirmAll=false;
var F={masuk:{q:'',from:'',to:'',st:'',sort:1},luar:{q:'',from:'',to:'',st:'',sort:1},rekap:{from:'',to:''},pr:{from:'',to:''}};
var D={p:'all',from:'',to:''};

function rebuild(){
  var ids={};rows.forEach(function(r){ids[r.id]=1});
  pmap={};validP=[];
  proses.forEach(function(p){if(ids[p.laporanId]){pmap[p.laporanId]=(pmap[p.laporanId]||0)+num(p.koli);validP.push(p)}});
}
function calc(r){
  var book=num(r.book),non=num(r.nonbook),total=book+non,base=num(r.diproses),logged=pmap[r.id]||0;
  var done=Math.min(base+logged,total);
  return {book:book,non:non,total:total,base:base,logged:logged,done:done,left:total-done,pct:total?Math.round(done/total*100):0,
    status:(total>0&&done>=total)?'selesai':(done>0?'proses':'belum')};
}
function sums(list){
  var s={book:0,non:0,total:0,done:0,left:0,n:0};
  list.forEach(function(r){var c=calc(r);s.book+=c.book;s.non+=c.non;s.total+=c.total;s.done+=c.done;s.left+=c.left;s.n++});
  s.pct=s.total?Math.round(s.done/s.total*100):0;return s;
}
function pill(s){return '<span class="pill st-'+s+'">'+ST[s]+'</span>'}
function byId(id){return rows.find(function(r){return r.id===id})}
function sumber(r){return r?(r.kategori==='luar'?(r.asal||'STO & Cetul'):'Duta TO Buluh Indah'):'(dihapus)'}
function procByDate(d){
  var t=0;
  rows.forEach(function(r){if(r.tanggal===d)t+=num(r.diproses)});
  validP.forEach(function(p){if(p.tanggal===d)t+=num(p.koli)});
  return t;
}
function masukByDate(d){return sums(rows.filter(function(r){return r.tanggal===d})).total}
function outstanding(){
  return rows.filter(function(r){return calc(r).left>0}).sort(function(a,b){
    return a.tanggal<b.tanggal?-1:a.tanggal>b.tanggal?1:(a.createdAt||0)-(b.createdAt||0)});
}

/* ---------- store ---------- */
function getDb(){
  var c=window.FIREBASE_CONFIG;
  if(!c||!c.apiKey||/ISI_/.test(c.apiKey+c.projectId))return Promise.resolve(null);
  if(!window.firebase)return Promise.reject(new Error('sdk'));
  try{
    var app=firebase.apps.length?firebase.app():firebase.initializeApp(c);
    var fs=firebase.firestore();
    try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    return Promise.resolve(fs);
  }catch(e){return Promise.reject(e)}
}
var user=null,authOn=false;
function isAdminUser(u){
  if(!u)return false;
  var L=(window.ADMIN_EMAILS||[]).map(function(e){return String(e).toLowerCase()}).filter(function(e){return e&&!/isi_/i.test(e)});
  return !L.length||L.indexOf(String(u.email||'').toLowerCase())>=0;
}
function canEdit(){return mode==='local'||(mode==='shared'&&isAdminUser(user))}
var DENIED={code:'denied'};
var store={
  coll:null,pcoll:null,
  init:function(){
    var self=this;
    var timer=setTimeout(function(){if(!loaded){loadSlow=true;syncChip();refresh()}},10000);
    getDb().catch(function(){return null}).then(function(db){
      if(!db){self.local();clearTimeout(timer);return}
      mode='shared';self.coll=db.collection('laporan');self.pcoll=db.collection('proses');
      try{authOn=true;firebase.auth().onAuthStateChanged(function(u){user=u;syncChip();refresh()})}catch(e){authOn=false}
      self.coll.onSnapshot(function(snap){
        rows=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        if(!snap.metadata.fromCache||!loaded){loaded=true;loadSlow=false;clearTimeout(timer)}
        rebuild();syncChip();refresh();
      },function(){loaded=true;clearTimeout(timer);mode='error';syncChip();refresh()});
      self.pcoll.onSnapshot(function(snap){
        proses=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        rebuild();refresh();
      },function(){});
    });
  },
  local:function(){
    mode='local';var raw=null;
    try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(raw&&Array.isArray(raw.rows)){rows=raw.rows;proses=Array.isArray(raw.proses)?raw.proses:[]}
    else{rows=SAMPLE.map(function(r){return Object.assign({},r)});proses=[];this.persist()}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    loaded=true;rebuild();syncChip();refresh();
  },
  persist:function(){try{localStorage.setItem(KEY,JSON.stringify({rows:rows,proses:proses}))}catch(e){toast('Peramban menolak menyimpan data. Nonaktifkan mode privat.')}},
  save:function(id,obj){
    if(!canEdit())return Promise.reject(DENIED);
    if(this.coll){var ref=id?this.coll.doc(id):this.coll.doc();return ref.set(obj)}
    obj.id=id||('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
    var i=rows.findIndex(function(r){return r.id===obj.id});
    if(i>=0)rows[i]=obj;else rows.push(obj);
    this.persist();rebuild();refresh();return Promise.resolve();
  },
  del:function(id){
    if(!canEdit())return Promise.reject(DENIED);
    var self=this,logs=proses.filter(function(p){return p.laporanId===id});
    if(this.coll)return this.coll.doc(id).delete().then(function(){return Promise.all(logs.map(function(p){return self.delP(p.id)}))});
    rows=rows.filter(function(r){return r.id!==id});proses=proses.filter(function(p){return p.laporanId!==id});
    this.persist();rebuild();refresh();return Promise.resolve();
  },
  saveP:function(obj,id){
    if(!canEdit())return Promise.reject(DENIED);
    if(this.pcoll)return (id?this.pcoll.doc(id):this.pcoll.doc()).set(obj);
    obj.id=id||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var j=proses.findIndex(function(p){return p.id===obj.id});
    if(j>=0){proses[j]=obj;this.persist();rebuild();refresh();return Promise.resolve()}
    proses.push(obj);this.persist();rebuild();refresh();return Promise.resolve();
  },
  delP:function(id){
    if(!canEdit())return Promise.reject(DENIED);
    if(this.pcoll)return this.pcoll.doc(id).delete();
    proses=proses.filter(function(p){return p.id!==id});this.persist();rebuild();refresh();return Promise.resolve();
  }
};

/* ---------- filter ---------- */
function filtered(kind){
  var f=F[kind],q=f.q.trim().toLowerCase();
  var list=rows.filter(function(r){
    if(r.kategori!==kind)return false;
    if(f.from&&r.tanggal<f.from)return false;
    if(f.to&&r.tanggal>f.to)return false;
    if(f.st&&calc(r).status!==f.st)return false;
    if(q){var hay=(fmt(r.tanggal)+' '+r.tanggal+' '+(r.asal||'')).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
  list.sort(function(a,b){return (a.tanggal<b.tanggal?-1:a.tanggal>b.tanggal?1:(a.createdAt||0)-(b.createdAt||0))*f.sort});
  return list;
}
function rekapRows(from,to){
  var m={};
  rows.forEach(function(r){
    if(from&&r.tanggal<from)return;if(to&&r.tanggal>to)return;
    (m[r.tanggal]=m[r.tanggal]||[]).push(r);
  });
  return Object.keys(m).sort().map(function(d){var s=sums(m[d]);s.tanggal=d;return s});
}
function logsFiltered(){
  var g=F.pr;
  return validP.filter(function(p){return (!g.from||p.tanggal>=g.from)&&(!g.to||p.tanggal<=g.to)}).sort(function(a,b){
    return a.tanggal<b.tanggal?1:a.tanggal>b.tanggal?-1:(b.createdAt||0)-(a.createdAt||0)});
}
function logsByDay(list){
  var m={};list.forEach(function(p){var o=m[p.tanggal]=m[p.tanggal]||{tanggal:p.tanggal,koli:0,n:0};o.koli+=num(p.koli);o.n++});
  return Object.keys(m).sort().reverse().map(function(k){return m[k]});
}
function drange(){
  var t=today();
  if(D.p==='7')return [addDays(t,-6),''];
  if(D.p==='30')return [addDays(t,-29),''];
  if(D.p==='bulan')return [t.slice(0,8)+'01',''];
  if(D.p==='custom')return [D.from,D.to];
  return ['',''];
}

function chartHtml(){
  var t=today(),days=[],i,NN=chartN();for(i=NN-1;i>=0;i--)days.push(addDays(t,-i));
  var inn=days.map(masukByDate),out=days.map(procByDate);
  var M=Math.max.apply(null,inn.concat(out,[1]));
  var steps=[1,2,5,10,20,50,100,200,500,1000,2000,5000];
  var step=steps.filter(function(s){return M/s<=4})[0]||10000;
  var top=Math.ceil(M/step)*step;
  var gw=40,L=38,R=8,T=10,B=26,ph=170,W=L+R+NN*gw,H=T+ph+B,bw=14;
  var y=function(v){return T+ph-(v/top)*ph};
  var g='';
  for(var k=0;k<=top;k+=step){g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(k)+'" y2="'+y(k)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(k)+3)+'" text-anchor="end">'+k+'</text>'}
  var bars='';
  days.forEach(function(d,j){
    var x0=L+j*gw+(gw-2*bw-2)/2,cx=L+j*gw+gw/2;
    var a=inn[j],b=out[j];
    if(a>0)bars+='<rect class="c-in" x="'+x0+'" y="'+y(a)+'" width="'+bw+'" height="'+(ph-(y(a)-T))+'" rx="2"><title>'+fmt(d)+': masuk '+a+' koli</title></rect>';
    if(b>0)bars+='<rect class="c-out" x="'+(x0+bw+2)+'" y="'+y(b)+'" width="'+bw+'" height="'+(ph-(y(b)-T))+'" rx="2"><title>'+fmt(d)+': diproses '+b+' koli</title></rect>';
    bars+='<text class="'+(d===t?'axb':'ax')+'" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+fmt(d).slice(0,5)+'</text>';
  });
  return '<div class="keys"><span style="--k:var(--in)">Barang masuk</span><span style="--k:var(--ok-fill)">Koli diproses</span></div>'+
    '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik koli masuk dan diproses per hari">'+g+bars+'</svg></div>';
}
function chartN(){return window.innerWidth<700?7:14}

function alloc(n){
  var res=[],rest=n;
  outstanding().forEach(function(r){
    if(rest<=0)return;var l=calc(r).left,take=Math.min(l,rest);
    if(take>0){res.push({r:r,koli:take});rest-=take}
  });
  return {parts:res,rest:rest};
}
function pTargets(sel){
  var o=outstanding();
  $('#p-target').innerHTML=o.length?o.map(function(r){return '<option value="'+esc(r.id)+'">'+fmt(r.tanggal)+' · '+esc(sumber(r))+' · sisa '+calc(r).left+' koli</option>'}).join(''):'<option value="">Tidak ada barang yang menunggu</option>';
  if(sel)$('#p-target').value=sel;
}
function pInfo(){
  var n=num($('#p-koli').value),m=$('#p-mode').value,all=sums(rows).left,h;
  $('#p-target-w').hidden=m!=='manual';

    else if(n>all)h='Jumlah melebihi total yang menunggu ('+nf(all)+' koli).';

  }

function closeProses(){$('#pm').hidden=true}
$('#pf').addEventListener('input',pInfo);
$('#pf').addEventListener('change',pInfo);

$('#pf').addEventListener('submit',function(e){
  e.preventDefault();
  var t=$('#p-tanggal').value,n=num($('#p-koli').value),m=$('#p-mode').value,ket=$('#p-ket').value.trim(),parts;
  if(!t)return perr('Isi tanggal proses.');
  if(n<1)return perr('Isi jumlah koli yang diproses, minimal 1.');
  if(m==='manual'){
    var r=byId($('#p-target').value);
    if(!r||calc(r).left<1)return perr('Pilih laporan yang masih punya sisa.');
    if(n>calc(r).left)return perr('Jumlah ('+n+') melebihi sisa laporan ('+calc(r).left+' koli).');

  }else{
    var all=sums(rows).left;

  })).then(function(){toast(n+' koli dicatat diproses pada '+fmt(t)+'.')},function(er){toast(errMsg(er))});

/* ---------- ekspor ---------- */
var HM=['No.','Tanggal Masuk','Nonbook (Koli)','Book (Koli)','Total Koli','Sudah Diproses','Belum Diproses','Status','Keterangan'];
var HL=['No.','Tanggal Masuk','Asal Barang','Nonbook (Koli)','Book (Koli)','Total Koli','Sudah Diproses','Belum Diproses','Status','Keterangan'];
var HR=['Tanggal','Nonbook','Book','Total Koli','Sudah Diproses','Belum Diproses','Progres (%)'];
function sheetReport(kind,list,name){
  var luar=kind==='luar',s=sums(list);
  var body=list.map(function(r,i){var c=calc(r);
    var row=[i+1,fmt(r.tanggal)];if(luar)row.push(r.asal||'');
    return row.concat([c.non,c.book,c.total,c.done,c.left,ST[c.status],r.ket||'']);
  });
  var foot=['','Jumlah'];if(luar)foot.push('');
  foot=foot.concat([s.non,s.book,s.total,s.done,s.left,s.pct+'% selesai','']);
  return {name:name,title:name,head:luar?HL:HM,body:body,foot:foot};
}
function sheetRekap(from,to){
  var rk=rekapRows(from,to),t=sums(rows.filter(function(r){return (!from||r.tanggal>=from)&&(!to||r.tanggal<=to)}));
  return {name:'Rekap per Tanggal',title:'Rekap per Tanggal Masuk',head:HR,
    body:rk.map(function(x){return [fmt(x.tanggal),x.non,x.book,x.total,x.done,x.left,x.pct]}),
    foot:['Jumlah',t.non,t.book,t.total,t.done,t.left,t.pct]};
}
function sheetsProses(list){
  var days=logsByDay(list),tot=list.reduce(function(a,p){return a+num(p.koli)},0);
  return [
    {name:'Proses per Hari',title:'Proses Harian per Hari',head:['Tanggal Proses','Koli Diproses','Jumlah Catatan'],
      body:days.map(function(d){return [fmt(d.tanggal),d.koli,d.n]}),foot:['Jumlah',tot,list.length]},
    {name:'Catatan Proses',title:'Catatan Proses Harian',head:['No.','Tanggal Proses','Tanggal Masuk Barang','Sumber','Koli Diproses','Keterangan'],
      body:list.map(function(p,i){var r=byId(p.laporanId);return [i+1,fmt(p.tanggal),r?fmt(r.tanggal):'',sumber(r),num(p.koli),p.ket||'']}),
      foot:['','','','Jumlah',tot,'']}
  ];
}
function sheetsFor(kind){
  if(kind==='masuk')return [sheetReport('masuk',filtered('masuk'),'Duta TO Buluh Indah')];
  if(kind==='luar')return [sheetReport('luar',filtered('luar'),'Penerimaan STO & Cetul')];
  if(kind==='rekap')return [sheetRekap(F.rekap.from,F.rekap.to)];
  if(kind==='proses')return sheetsProses(logsFiltered());
  var all=function(k){return rows.filter(function(r){return r.kategori===k}).sort(function(a,b){return a.tanggal<b.tanggal?-1:a.tanggal>b.tanggal?1:0})};
  var allLogs=validP.slice().sort(function(a,b){return a.tanggal<b.tanggal?1:a.tanggal>b.tanggal?-1:0});
  return [sheetReport('masuk',all('masuk'),'Duta TO Buluh Indah'),sheetReport('luar',all('luar'),'Penerimaan STO & Cetul')].concat(sheetsProses(allLogs),[sheetRekap('','')]);
}
function saveFile(name,data,mime){
  var blob=new Blob([data],{type:mime||'application/octet-stream'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
}
function toCsv(sheets){
  var q=function(v){
    if(typeof v==='string'&&/^[=+\-@]/.test(v))v="'"+v;
    v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var out=['sep=;'];
  sheets.forEach(function(s,i){
    if(i>0)out.push('');
    if(sheets.length>1)out.push(q(s.title));
    out.push(s.head.map(q).join(';'));
    s.body.forEach(function(r){out.push(r.map(q).join(';'))});
    out.push(s.foot.map(q).join(';'));
  });
  return '\ufeff'+out.join('\r\n');
}
function doBackup(){
  var j={app:'gudang-buluh-indah',versi:2,dibuat:new Date().toISOString(),rows:rows,proses:proses};
  saveFile('cadangan-gudang-buluh-indah-'+today()+'.json',JSON.stringify(j,null,1),'application/json');
  toast('Cadangan diunduh.');
}
function doRestore(f){
  if(!f||!guardEdit())return;
  var rd=new FileReader(),isD=function(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)};
  rd.onerror=function(){toast('File tidak dapat dibaca.')};
  rd.onload=function(){
    var j;try{j=JSON.parse(rd.result)}catch(e){return toast('File bukan JSON yang valid.')}
    if(!j||!Array.isArray(j.rows))return toast('Format cadangan tidak dikenali.');
    var rs=j.rows.filter(function(r){return r&&typeof r.id==='string'&&r.id&&(r.kategori==='masuk'||r.kategori==='luar')&&isD(r.tanggal)});
    var ps=(Array.isArray(j.proses)?j.proses:[]).filter(function(p){return p&&typeof p.id==='string'&&p.id&&typeof p.laporanId==='string'&&isD(p.tanggal)&&num(p.koli)>0});
    if(!rs.length&&!ps.length)return toast('Tidak ada data valid di file ini.');
    if(!confirm('Pulihkan '+rs.length+' laporan dan '+ps.length+' catatan proses?\nData dengan ID sama akan ditimpa, data lain tetap ada.'))return;
    var jobs=rs.map(function(r){
      return store.save(r.id,{kategori:r.kategori,tanggal:r.tanggal,asal:r.kategori==='luar'?String(r.asal||''):'',book:num(r.book),nonbook:num(r.nonbook),
        diproses:num(r.diproses),ket:String(r.ket||''),contoh:!!r.contoh,createdAt:Number(r.createdAt)||Date.now(),updatedAt:Date.now()});
    }).concat(ps.map(function(p){
      return store.saveP({laporanId:p.laporanId,tanggal:p.tanggal,koli:num(p.koli),ket:String(p.ket||''),createdAt:Number(p.createdAt)||Date.now()},p.id);
    }));
    Promise.all(jobs).then(function(){toast('Pemulihan selesai: '+rs.length+' laporan, '+ps.length+' catatan proses.')},function(er){toast(errMsg(er))});
  };
  rd.readAsText(f);
}
function doExport(kind,fmtType){
  var sheets=sheetsFor(kind);
  var base={masuk:'laporan-duta-to-buluh-indah',luar:'laporan-penerimaan-sto-cetul',proses:'proses-harian',rekap:'rekapitulasi-laporan',semua:'laporan-gudang-buluh-indah'}[kind]+'-'+today();
  var data;
  try{
    if(fmtType==='csv'){data=toCsv(sheets)}
    else if(fmtType==='xlsx'){
      if(!window.XLSX)return toast('Pustaka Excel belum termuat. Coba lagi sebentar lagi.');
      var wb=XLSX.utils.book_new();
      sheets.forEach(function(s){
        var ws=XLSX.utils.aoa_to_sheet([s.head].concat(s.body,[s.foot]));
        ws['!cols']=s.head.map(function(h){return {wch:Math.max(12,h.length+2)}});
        XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31));
      });
      data=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    }else{
      if(!(window.jspdf&&window.jspdf.jsPDF))return toast('Pustaka PDF belum termuat. Coba lagi sebentar lagi.');
      var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
      sheets.forEach(function(s,i){
        if(i>0)doc.addPage();
        doc.setFontSize(14);doc.text('Gudang Gramedia Buluh Indah - '+s.title,40,40);
        doc.setFontSize(9);doc.text('Dicetak '+fmt(today()),40,56);
        doc.autoTable({startY:68,head:[s.head],body:s.body,foot:[s.foot],styles:{fontSize:8.5,cellPadding:4},
          headStyles:{fillColor:[196,22,31]},footStyles:{fillColor:[240,235,233],textColor:[32,26,25]},margin:{left:40,right:40}});
      });
      data=doc.output('arraybuffer');
    }
  }catch(er){return toast('Gagal membuat file. Coba lagi.')}
  var mime={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',csv:'text/csv;charset=utf-8'}[fmtType];
  saveFile(base+'.'+fmtType,data,mime);toast('File diunduh.');
}

  else if(a==='pdel'){pendingDelP=id;refresh()}
  else if(a==='pdel-no'){pendingDelP=null;refresh()}
  else if(a==='pdel-yes'){pendingDelP=null;store.delP(id).then(function(){toast('Catatan proses dihapus.')},function(er){toast(errMsg(er))});refresh()}
  else if(a==='del-sample'){
    var ids=rows.filter(function(r){return r.contoh}).map(function(r){return r.id});
    Promise.all(ids.map(function(i){return store.del(i)})).then(function(){toast('Data contoh dihapus.')},function(er){toast(errMsg(er))});
  }
  else if(a==='del-all'){confirmAll=true;settings()}
  else if(a==='del-all-no'){confirmAll=false;settings()}
  else if(a==='del-all-yes'){
    confirmAll=false;
    var rs=rows.slice(),ps=proses.slice();
    Promise.all(rs.map(function(r){return store.del(r.id)}).concat(ps.map(function(p){return store.delP(p.id)}))).then(function(){toast('Semua data dihapus.')},function(er){toast(errMsg(er))});
    settings();
  }
});
function onHash(){
  var h=(location.hash||'').replace('#','');
  route=TITLES[h]?h:'dashboard';pendingDel=null;pendingDelP=null;confirmAll=false;mount();
}
var NAV=[['dashboard','Laporan Ringkas','Laporan','home'],['masuk','Laporan Barang Masuk','Masuk','inbox'],['luar','Penerimaan STO & Cetul','STO & Cetul','swap'],
  ['proses','Proses Harian','Proses','list'],['rekap','Rekapitulasi Laporan','Rekap','bars'],['pengaturan','Pengaturan Data','Data','sliders']];
$('#nav').innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'" data-r="'+n[0]+'">'+icon(n[3])+'<span class="lb">'+esc(n[1])+'</span><span class="sl">'+esc(n[2])+'</span></a>'}).join('');
document.querySelectorAll('.logo').forEach(function(e){e.innerHTML=icon('box')});
$('#dnow').textContent=dayName(today())+', '+fmt(today());
window.addEventListener('hashchange',onHash);
$('#authbtn').addEventListener('click',function(){
  if(user){firebase.auth().signOut().then(function(){toast('Anda sudah keluar.')},function(){toast('Gagal keluar. Coba lagi.')})}
  else openLogin();
});
$('#l-cancel').addEventListener('click',function(){$('#lm').hidden=true});
$('#lm').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
$('#lf').addEventListener('submit',function(e){
  e.preventDefault();
  var em=$('#l-email').value.trim(),pw=$('#l-pass').value,er=$('#lerr'),ok=$('#l-ok');
  if(!em||!pw){er.textContent='Isi email dan kata sandi.';er.hidden=false;return}
  er.hidden=true;ok.disabled=true;ok.textContent='Memeriksa…';
  firebase.auth().signInWithEmailAndPassword(em,pw).then(function(){
    $('#lm').hidden=true;toast('Berhasil masuk.');
  },function(x){
    var c=x&&x.code,m={'auth/invalid-credential':'Email atau kata sandi salah.','auth/wrong-password':'Email atau kata sandi salah.','auth/user-not-found':'Email atau kata sandi salah.',
      'auth/invalid-email':'Format email tidak valid.','auth/too-many-requests':'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.',
      'auth/network-request-failed':'Tidak ada koneksi internet.','auth/operation-not-allowed':'Login Email/Password belum diaktifkan di Firebase.'}[c];
    er.textContent=m||'Gagal masuk. Coba lagi.';er.hidden=false;
  }).then(function(){ok.disabled=false;ok.textContent='Masuk'});
});
onHash();syncChip();store.init();
})();
</script>
